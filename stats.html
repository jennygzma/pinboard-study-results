<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interaction Stats</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="bg-gray-50 text-gray-900">
  <main class="mx-auto max-w-6xl px-5 py-6">
    <header class="mb-4">
      <h1 class="text-2xl font-semibold">Interaction Stats Dashboard</h1>
      <p class="mt-1 text-sm text-gray-600">Per-person totals and average percentages for created, modified, and deleted lines/cards.</p>
      <a class="mt-2 inline-block text-sm text-blue-700 underline" href="/">Back to archive viewer</a>
    </header>

    <section id="summary" class="mb-6 rounded-lg border bg-white p-4 shadow-sm"></section>
    <section id="cards" class="grid gap-4 md:grid-cols-2"></section>
  </main>
  <script src="/stats.js" defer></script>
</body>
</html>
