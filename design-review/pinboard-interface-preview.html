<div id="pinboard-drawing">
  <style>
    #pinboard-drawing { --pb-navy:#16325f; --pb-ink:#20324a; --pb-muted:#586779; --pb-orange:#ee751c; --pb-sand:#fff8ee; --pb-aqua:#dff3ed; --pb-line:#d7e1e5; --pb-paper:#fff; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--pb-ink); background:var(--pb-sand); border-radius:16px; overflow:hidden; }
    #pinboard-drawing * { box-sizing:border-box; }
    #pinboard-drawing [hidden] { display:none !important; }
    #pinboard-drawing button,#pinboard-drawing input,#pinboard-drawing select { font:inherit; }
    #pinboard-drawing button { cursor:pointer; }
    #pinboard-drawing button:focus-visible,#pinboard-drawing input:focus-visible,#pinboard-drawing select:focus-visible { outline:3px solid #147c8c; outline-offset:2px; }
    #pinboard-drawing .p-top { padding:18px 24px; background:var(--pb-paper); border-bottom:1px solid var(--pb-line); display:flex; align-items:center; gap:20px; flex-wrap:wrap; padding-right:100px; }
    #pinboard-drawing .p-brand { color:var(--pb-navy); font-weight:700; letter-spacing:.11em; }
    #pinboard-drawing .p-top button { border:0; background:transparent; color:var(--pb-muted); padding:7px 4px; border-bottom:2px solid transparent; }
    #pinboard-drawing .p-top button[aria-current="page"] { color:var(--pb-navy); border-color:var(--pb-orange); }
    #pinboard-drawing .p-draft { margin-left:auto; color:var(--pb-muted); font-size:12px; }
    #pinboard-drawing .p-body { padding:26px; }
    #pinboard-drawing h1 { font:32px/1.15 Georgia,serif; color:var(--pb-navy); margin:0 0 8px; }
    #pinboard-drawing h2 { font:24px/1.2 Georgia,serif; color:var(--pb-navy); margin:0; }
    #pinboard-drawing h3 { margin:0 0 8px; font-size:15px; }
    #pinboard-drawing p { margin:0; }
    #pinboard-drawing .p-muted { color:var(--pb-muted); }
    #pinboard-drawing .p-small { font-size:12px; }
    #pinboard-drawing .p-actions { display:flex; align-items:center; flex-wrap:wrap; gap:9px; }
    #pinboard-drawing .p-button { padding:7px 12px; border:1px solid var(--pb-line); background:var(--pb-paper); color:var(--pb-navy); border-radius:7px; }
    #pinboard-drawing .p-button:hover { border-color:var(--pb-orange); }
    #pinboard-drawing .p-button[aria-pressed="true"],#pinboard-drawing .p-button.p-primary { background:var(--pb-navy); color:#fff; border-color:var(--pb-navy); }
    #pinboard-drawing .p-pill { display:inline-block; padding:3px 8px; background:var(--pb-aqua); border-radius:5px; color:#24574f; font-size:12px; }
    #pinboard-drawing .p-warning { color:#81430c; background:#fff0d5; border-radius:6px; padding:8px 10px; }
    #pinboard-drawing .p-toolbar { display:flex; gap:12px; align-items:end; flex-wrap:wrap; margin:22px 0 18px; }
    #pinboard-drawing label { color:var(--pb-muted); font-size:12px; }
    #pinboard-drawing label input:not([type="checkbox"]),#pinboard-drawing label select { display:block; margin-top:4px; border:1px solid var(--pb-line); border-radius:7px; padding:8px; background:var(--pb-paper); color:var(--pb-ink); max-width:100%; }
    #pinboard-drawing .p-search { flex:1; min-width:180px; }
    #pinboard-drawing .p-search input { width:100%; }
    #pinboard-drawing .p-rows { display:grid; gap:22px; }
    #pinboard-drawing .p-person { background:var(--pb-paper); border:1px solid var(--pb-line); border-radius:14px; overflow:hidden; }
    #pinboard-drawing .p-person>summary { padding:12px 18px; color:var(--pb-navy); font-weight:600; background:#fffdf8; cursor:pointer; }
    #pinboard-drawing .p-pair { display:grid; grid-template-columns:1fr 1fr; gap:20px; padding:16px; }
    #pinboard-drawing .p-condition { min-width:0; }
    #pinboard-drawing .p-condition-head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:0 0 9px; }
    #pinboard-drawing .p-poster { width:100%; position:relative; display:block; padding:0; border:0; border-radius:10px; overflow:hidden; background:#18344a; color:#fff; aspect-ratio:16/9; }
    #pinboard-drawing .p-poster img { width:100%; height:100%; object-fit:cover; display:block; }
    #pinboard-drawing .p-poster-label { position:absolute; inset:auto 0 0; padding:28px 12px 10px; background:linear-gradient(transparent,rgba(10,26,43,.86)); display:flex; justify-content:space-between; align-items:center; text-align:left; }
    #pinboard-drawing .p-play { border:1px solid #ffffff99; border-radius:50%; width:32px; height:32px; display:grid; place-items:center; }
    #pinboard-drawing .p-slots { display:flex; gap:8px; margin-top:9px; }
    #pinboard-drawing .p-slots button { flex:1; }
    #pinboard-drawing .p-modal-head { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
    #pinboard-drawing .p-modal-meta { margin-top:9px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    #pinboard-drawing .p-phase { padding:20px 0; border-top:1px solid var(--pb-line); }
    #pinboard-drawing .p-phase-title { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:12px; }
    #pinboard-drawing .p-stage { display:grid; grid-template-columns:minmax(210px,var(--pb-video-share,30fr)) minmax(0,var(--pb-plan-share,70fr)); gap:20px; align-items:start; }
    #pinboard-drawing .p-video-column { min-width:0; }
    #pinboard-drawing .p-video-still { position:relative; background:#18344a; border-radius:10px; overflow:hidden; aspect-ratio:16/9; }
    #pinboard-drawing .p-video-still img { width:100%; height:100%; object-fit:cover; }
    #pinboard-drawing .p-video-controls { background:var(--pb-navy); color:#fff; padding:7px 9px; border-radius:0 0 8px 8px; display:flex; align-items:center; gap:7px; }
    #pinboard-drawing .p-video-controls input { width:100%; accent-color:#ffa056; }
    #pinboard-drawing .p-video-caption { color:var(--pb-muted); font-size:12px; margin-top:7px; }
    #pinboard-drawing .p-score { margin-top:15px; padding:13px 0; border-top:1px solid var(--pb-line); }
    #pinboard-drawing .p-score-value { font:25px/1.3 Georgia,serif; color:var(--pb-navy); }
    #pinboard-drawing .p-score details { margin-top:9px; }
    #pinboard-drawing details summary { cursor:pointer; }
    #pinboard-drawing .p-checks { list-style:none; padding:0; margin:8px 0; display:grid; gap:7px; }
    #pinboard-drawing .p-checks li { padding-left:10px; border-left:3px solid #548779; }
    #pinboard-drawing .p-checks li[data-outcome="fail"] { border-color:#ba4f3e; }
    #pinboard-drawing .p-checks li[data-outcome="mixed"] { border-color:#bf8217; }
    #pinboard-drawing .p-plan { min-width:0; background:var(--pb-paper); border:1px solid var(--pb-line); border-radius:10px; overflow:hidden; }
    #pinboard-drawing .p-plan-toolbar { padding:10px; display:flex; justify-content:space-between; gap:9px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--pb-line); }
    #pinboard-drawing .p-plan-toolbar .p-button { padding:4px 8px; font-size:12px; }
    #pinboard-drawing .p-timeline-shell { overflow:auto; max-height:350px; background:#fcfdfd; }
    #pinboard-drawing .p-timeline { min-width:720px; }
    #pinboard-drawing .p-grid-row { display:grid; }
    #pinboard-drawing .p-grid-head { position:sticky; top:0; z-index:4; }
    #pinboard-drawing .p-beat { background:var(--pb-aqua); color:#254e49; border-right:1px solid #bfded5; padding:9px; font-size:12px; }
    #pinboard-drawing .p-beat strong { display:block; font-weight:600; }
    #pinboard-drawing .p-track { background:#f5f8f9; border-right:1px solid var(--pb-line); padding:11px 7px; font-size:11px; color:var(--pb-muted); position:sticky; left:0; z-index:3; }
    #pinboard-drawing .p-cell { position:relative; border-right:1px solid var(--pb-line); border-bottom:1px solid var(--pb-line); background:repeating-linear-gradient(90deg,transparent,transparent 49px,#eef2f3 50px); }
    #pinboard-drawing .p-grid-card { position:absolute; padding:6px; border:1px solid #d6dfe2; border-radius:4px; background:#fff; color:var(--pb-ink); text-align:left; font-size:11px; height:68px; overflow:hidden; }
    #pinboard-drawing .p-grid-card:hover { z-index:2; border-color:#147c8c; }
    #pinboard-drawing .p-card-kind { display:block; color:var(--pb-muted); font-size:10px; margin-bottom:2px; }
    #pinboard-drawing .p-grid-card[data-change="changed"] { background:#fff2df; border-left:3px solid var(--pb-orange); }
    #pinboard-drawing .p-grid-card[data-change="added"] { background:#e9f8ee; border-left:3px solid #3c8058; }
    #pinboard-drawing .p-grid-card[data-change="removed"] { background:#fceceb; border-left:3px solid #ba4f3e; }
    #pinboard-drawing .p-legend { display:flex; gap:12px; flex-wrap:wrap; color:var(--pb-muted); padding:9px 11px; border-top:1px solid var(--pb-line); font-size:11px; }
    #pinboard-drawing .p-text { max-height:350px; overflow:auto; }
    #pinboard-drawing .p-line { display:grid; grid-template-columns:34px 1fr; gap:9px; padding:4px 12px 4px 0; font:12px/1.65 ui-monospace,SFMono-Regular,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
    #pinboard-drawing .p-line-number { color:#6e7f90; text-align:right; user-select:none; }
    #pinboard-drawing .p-line[data-change="added"] { background:#e9f8ee; }
    #pinboard-drawing .p-line[data-change="removed"] { background:#fceceb; }
    #pinboard-drawing .p-clip { display:inline; border:0; border-bottom:1px solid var(--pb-orange); padding:0; background:#fff2df; color:#81430c; font:inherit; text-align:left; }
    #pinboard-drawing .p-provenance { padding:10px; border-top:1px solid var(--pb-line); font-size:12px; }
    #pinboard-drawing .p-provenance dl { overflow-wrap:anywhere; }
    #pinboard-drawing .p-provenance dt { color:var(--pb-muted); margin-top:6px; }
    #pinboard-drawing .p-provenance dd { margin:0; }
    #pinboard-drawing .p-inspector { background:#fffdf7; border:1px solid #e6ccaa; border-radius:10px; margin:0 0 18px; padding:16px; }
    #pinboard-drawing .p-inspector-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
    #pinboard-drawing .p-inspector-body { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    #pinboard-drawing .p-inspector-body p { white-space:pre-wrap; overflow-wrap:anywhere; }
    #pinboard-drawing .p-change { display:block; padding:5px 0; border-bottom:1px solid var(--pb-line); }
    #pinboard-drawing .p-focus-stage .p-stage { grid-template-columns:1fr; }
    #pinboard-drawing .p-focus-stage .p-video-column { display:none; }
    #pinboard-drawing .p-focus-stage .p-timeline-shell,#pinboard-drawing .p-focus-stage .p-text { max-height:650px; }
    #pinboard-drawing .p-table-shell { overflow:auto; }
    #pinboard-drawing table { width:100%; border-collapse:collapse; background:#fff; margin-top:18px; font-size:12px; }
    #pinboard-drawing th,#pinboard-drawing td { padding:10px; border-bottom:1px solid var(--pb-line); text-align:left; vertical-align:top; min-width:125px; }
    #pinboard-drawing th { color:var(--pb-navy); background:#edf4f4; }
    #pinboard-drawing .p-interactions { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:20px; }
    #pinboard-drawing .p-interaction { background:#fff; padding:18px; border-top:3px solid var(--pb-orange); border-radius:8px; }

    #pinboard-drawing .p-statusline { margin-top:12px; }
    @media(max-width:700px) { #pinboard-drawing .p-body { padding:16px; } #pinboard-drawing .p-pair,#pinboard-drawing .p-stage,#pinboard-drawing .p-inspector-body,#pinboard-drawing .p-interactions { grid-template-columns:1fr; } #pinboard-drawing .p-top { gap:12px; padding:14px 16px; padding-right:85px; } #pinboard-drawing .p-draft { margin:0; } #pinboard-drawing h1 { font-size:27px; } }

  <script type="application/json" id="pb-data">{"projects":[{"code":"n1","participant":"n1 annie","condition":"text","name":"annie task 1","id":"5af28ebc-de72-4cce-9657-a721c0e8610f","moments":{"b52ca22a-ba95-4310-b5d8-0ac6b6acc7dc":{"videoName":"A001C002_240718OR","startS":14,"endS":25,"notes":"Hi, I'm Viviana matsuda. Um, I do pottery for a living. My brand name is Mud Witch. Um, yeah. I'm a full time potter."},"75615fd3-8ea7-43c7-982a-d8e078c74cd9":{"videoName":"A001C004_240718BC","startS":26.2,"endS":28.5,"notes":"So my book is called Playful Pottery."},"127e6057-2517-40cf-bada-fecc0ca3ae73":{"videoName":"A001C004_240718BC","startS":30,"endS":37.6,"notes":"I wanted something that was a more simplified book about pottery for beginners."},"5771e88a-573d-4942-9f10-cb6826f64dd2":{"videoName":"A001C004_240718BC","startS":37.6,"endS":57.4,"notes":"I feel like what I always saw or referenced were these, like, big, hearty old school books that never really talked about color had super fun things to do in them. Um, very like old school pottery."},"c5668b43-c165-4408-ab49-b5da5b3e83fa":{"videoName":"A001C004_240718BC","startS":86.9,"endS":98,"notes":"I hope the book provides to its readers at, um, like a good reference for just general, um, clay knowledge."},"bf8b1bf8-a6e5-42ef-8d73-f0584e7c5170":{"videoName":"A001C004_240718BC","startS":98,"endS":107.6,"notes":"But also, I really want people to be creative and be kind to themselves."},"d2abeaf4-f3b6-4ff4-bb78-7c40ecdf8b37":{"videoName":"A001C004_240718BC","startS":107.6,"endS":119.7,"notes":"I think that was like the main theme was creativity involves, um, being kind to yourself, which I don't think is Talked about as much as it should be."},"3197ee7c-b39a-45f0-90e1-2f5340f9b0c0":{"videoName":"A001C004_240718BC","startS":133.5,"endS":147.2,"notes":"When you're kind to yourself, you are rolling with the punches. You are more open to be flexible with your designs, and you can end up with something that turns out way better than your original design."},"50ec23e0-7b9e-42ee-92e4-464ab5cf88e8":{"videoName":"A001C004_240718BC","startS":147.4,"endS":151.6,"notes":"I think being open minded when it comes to design is really important."},"76adf942-17ab-42d7-86f9-e77eff0fdbc1":{"videoName":"A001C004_240718BC","startS":501.6,"endS":521.3,"notes":"And then you're like, well, what if this looked slightly different? Or what if this, instead of a tulip was a daffodil? And let's try to achieve that. So it's kind of like sitting at the wheel and just like letting yourself adjust, grow whatever ideas and just see if they're achievable."},"59a9281c-6b02-476e-82da-5e9b3974ac45":{"videoName":"B003C006_240719KM","startS":56.9,"endS":64.8,"notes":"zoom of paitning"},"b8ffcf32-9df6-4de2-993d-e597c9a2b591":{"videoName":"B003C006_240719KM","startS":84.3,"endS":95,"notes":"closeup"},"ef2c842e-5cc2-4510-8930-7896908f23ef":{"videoName":"B003C007_240719CC","startS":34.2,"endS":39.8,"notes":"putting item down"},"638efb82-1a84-40d7-8d66-774537161249":{"videoName":"B003C011_240719YX","startS":5.9,"endS":9.1,"notes":"shaping clay on the wheel"},"cb69193c-fc00-4020-8ca0-fc96879da29a":{"videoName":"B003C011_240719YX","startS":68.3,"endS":84.3,"notes":"better view of her using tools"},"4cf90acb-a5b2-4768-8b03-9706bade26b6":{"videoName":"B003C039_240719DU","startS":7.9,"endS":9.8,"notes":"cute"},"178e835b-f303-47d9-87a0-619ac07834dd":{"videoName":"B003C050_240719XK","startS":9.6,"endS":14.2,"notes":"pastel ceramics on a shelf"}},"phases":{"initial":{"plan":"### Beat 1: Introduction to Viviana and Mud Witch (0:00 \u2013 0:15)\n* **Goal:** Introduce Viviana Matsuda, her studio identity, and establish a welcoming, artistic tone.\n* **A-Roll & Audio:** Viviana opens by introducing herself, her profession, and her brand name Mud Witch. [[clip: A001C002_240718OR | 14s-25s]]\n* **B-Roll:** Cut to exterior Mud Witch studio signage and atmosphere. [[clip: B003C006_240719KM | 56.9s-64.8s]]\n* **A-Roll:** Return to Viviana discuss or we'll throw it, you can kind of feel where the artist's hands have been."},"70671a4c-b3fc-4645-8004-6f5852640938":{"videoName":"A001C004_240718BC","startS":907.1,"endS":923.6,"notes":"and I think that that is very important because we, you know, in society, we're like, so becoming more and more disconnected to, like human interaction in especially, like, touch or anything along those lines."},"8403001e-14ca-427d-a038-584e2c06ff78":{"videoName":"B003C005_240719NB","startS":0.8,"endS":13.5,"notes":"grabbing things from shelves"},"2c88b00b-7cb4-4736-9fc3-79622f0f7265":{"videoName":"B003C006_240719KM","startS":136.4,"endS":145.1,"notes":"viviana painting"},"11031797-fff8-43a2-ad04-0387a08dfbbb":{"videoName":"B003C010_240719TX","startS":0,"endS":5.1,"notes":"mud witch sign on shelf"},"29a41782-54cf-410d-821d-ac508827a915":{"videoName":"B003C011_240719YX","startS":5.9,"endS":9.1,"notes":"shaping clay on the wheel"},"edda98e9-e620-4d69-9880-3b6a3b20579e":{"videoName":"B003C011_240719YX","startS":11,"endS":16.8,"notes":"focused"},"5dd962f0-20eb-449a-83ec-b560bb17683c":{"videoName":"B003C011_240719YX","startS":21.3,"endS":37.9,"notes":"pottery"},"920a03c9-134a-4223-944e-6f1475aaed40":{"videoName":"B003C011_240719YX","startS":68.3,"endS":84.3,"notes":"better view of her using tools"},"635e4538-46ad-4670-b4d0-ce574b1d5fc4":{"videoName":"B003C028_240719CX","startS":5.8,"endS":11.2,"notes":"borll"},"bf191275-9cbe-41c5-bdcc-777a56291338":{"videoName":"B003C028_240719CX","startS":15.1,"endS":20.8,"notes":"notes"},"b71c7792-1a57-4792-aaf0-e7c92046b8d6":{"videoName":"B003C061_240719AN","startS":19.1,"endS":24.8,"notes":"walking in"},"9b4414dc-9636-4770-bfe0-f5ab1e7482d9":{"videoName":"B003C050_240719XK","startS":7.5,"endS":19.5},"c64fa184-8144-4f2d-9e38-6677ab5068aa":{"videoName":"B003C050_240719XK","startS":19.5,"endS":27},"90f5b709-e030-445a-b563-96891384626d":{"videoName":"B003C050_240719XK","startS":0,"endS":7.5},"31467d99-9e7b-40b1-ae22-616f217f8e2e":{"videoName":"B003C010_2 s the origin of her signature aesthetic: *\"when I was learning to do ceramics, I was also learning about the body positivity movement...\"* [[clip: A001C004_240718BC | 702.3s-707.8s]]\n  * She highlights her signature pieces: *\"I was like starting to make these like chubby shapes and they're literally called this is the Chubby Mug. This is the Venus mug...\"* [[clip: A001C004_240718BC | 709.9s-721s]]\n  * She wraps up the concept: *\"I think those two things kind of just mushed together the learning clay and the body positivity.\"* [[clip: A001C004_240718BC | 721.7s-728.5s]]\n* **Purpose:** Connects her design language directly to personal values and empowerment.\n\n---\n\n### Story Beat 3: Valuing Objects & Playful Outro (0:40 \u2013 0:60)\n* **Visual:** Transition into tactile detail shots of finished ceramics in the store. [[clip: B003C050_240719XK | 9.6s-14.2s]] Cut to the final visual of Viviana walking into frame, striking a cute, goofy pose, and walking out. [[clip: B003C039_240719DU | 7.9s-9.8s]]\n* **Audio / Music:** The music transitions to a warmer, more reflective track under the dialogue.\n* **Dialogue / Voiceover:**\n  * Viviana reflects: *\"one of my bigger spiel or whatever is that we need to really think about stuff like take a pause and think about the value of items...\"* [[clip: A001C004_240718BC | 1151.6s-1168.7s]]\n  * Concluding voiceover line lands over the final pose: *\"I want a select few things that I know will bring me happiness.\"* [[clip: A001C004_240718BC | 1172.1s-1197.2s]]\n* **Purpose:** Leaves the viewer with a thoughtful reflection on intentional living while ending on her signature charm and humor.","poster":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAgAAAQABAAD//gAQTGF2YzYyLjI4LjEwMQD/2wBDAAgYGBwYHCEhISEhISckJygoKCcnJycoKCgrKyszMzMrKysoKCsrMDAzMzc5NzQ0MzQ5OTw8PEhIRUVUVFdnZ3z/xACPAAABBQEBAQAAAAAAAAAAAAAGBAUHAwIAAQgBAAMBAQEAAAAAAAAAAAAAAAQDAgEABRAAAQMCBAMFBgQGAgMBAAAAAQIAEQMhEgQxQVFhcRMiBYEykdEUQqFiwSOxFVLw4TRyM0PxwqKCkhEAAgICAgMA a-48ca-a463-271a17beace7","kind":"text","text":"She continues establishing the premise of her project in voiceover: \u201cI wanted something that was a more simplified book about pottery for beginners.\u201d","time":{"positionSeconds":8,"durationSeconds":7}}]},{"row":"b_roll","cards":[{"id":"9381801a-6af2-41cf-81cd-3e4022401adf","kind":"text","text":"Mysterious close-up visuals of clay being shaped and carved on the wheel without revealing the artist's face.","time":{"positionSeconds":0,"durationSeconds":7}},{"id":"44bcf3c7-4a87-4351-99a2-482e50a14b37","kind":"asset","momentId":"a11aa0a3-8bc3-4b71-83c0-6a949dd6e3f9","time":{"positionSeconds":0,"durationSeconds":3.6}},{"id":"ad5b45d0-eafb-47f2-bd59-122b5a2abce7","kind":"text","text":"Over detailed shots of pottery tools and textures","time":{"positionSeconds":7,"durationSeconds":8}},{"id":"61921fd7-d0b5-424f-a117-187967084419","kind":"asset","momentId":"46694df2-4380-4c46-ac72-34c606aeec8d","time":{"positionSeconds":7,"durationSeconds":5.3999999999999995}}]},{"row":"music","cards":[{"id":"5a016edd-0d45-434b-8b08-f9df97a00632","kind":"text","text":"The video opens on the gentle track `calm_reflective`","time":{"positionSeconds":0,"durationSeconds":30,"endBeatId":"cfc98c69-2133-423a-92ad-2b19d1e58932"}}]},{"row":"text_graphics","cards":[]}]},{"id":"cfc98c69-2133-423a-92ad-2b19d1e58932","name":"Beat 2: Meeting Viviana and Introducing Playful Pottery","targetDurationSeconds":15,"tracks":[{"row":"a_roll","cards":[{"id":"9e2ffd61-496b-44d4-ba43-2f9219be4ab2","kind":"text","text":"We cut to Viviana on camera for the first time as she warmly introduces herself and her work.","time":{"positionSeconds":0,"durationSeconds":15}},{"id":"15dd07e6-e413-4033-b422-648c283a3d2d","kind":"asset","momentId":"8509fe24-3951-419a-aa00-21c07255b510","time":{"positionSeconds":0,"durationSeconds":11}}]},{"row":"b_roll","cards":[{"id":"4fe70c00-8e82-4b3e-b8bc-f4a17f419646","kind":"text","text":"The edit cuts between her interview and bright, colorful B-roll of her book and whimsical ceramic pieces, illustrating how *Playful Pottery* breaks away from traditional, intimidating pottery guides.","time":{"positionSeconds":0,"durationSeconds":15}},{"id":"9c08b916-b413-443a-b7e8-367d401745c4","kind":"asset","momentId":"902e006f-bd1f-4fa4-867a-465758df35a8","time":{"positionSeconds":0,"durationSeconds":12.7}}]},{"row":"music","cards":[]},{"row":"text_graphics","cards":[]}]},{"id":"506a43e2-6740-45a6-aaa8-9d8075c3202b","name":"Beat 3: The Philosophy of Flow and Kindness","targetDurationSeconds":15,"tracks":[{"row":"a_roll","cards":[{"id":"8735d917-65b7-44f0-91d2-b0e1fa95b1d1","kind":"text","text":"Viviana explains her perspective on the creative process\u2014treating pottery as an open flow of experimentation where mistakes are welcomed rather than feared.","time":{"positionSeconds":0,"durationSeconds":15}},{"id":"daec3e6a-7237-4423-86bc-cb7ed1c8663e","kind":"asset","momentId":"25c0b86e-d95d-4491-93a2-0ecc4e56e925","time":{"positionSeconds":0,"durationSeconds":15}}]},{"row":"b_roll","cards":[{"id":"b7944bba-a377-4ee7-b6b9-7d2e24dba462","kind":"text","text":"Visually, we see dynamic, hands-on footage of Viviana hand-building and painting vivid details onto ceramics, capturing the tactile joy and accessible nature of her craft.","time":{"positionSeconds":0,"durationSeconds":15}},{"id":"78d97b2d-cf08-4924-ac97-e1e828a9f347","kind":"asset","momentId":"8224d8e8-eaf2-4968-a1e3-c6248b56ca48","time":{"positionSeconds":0,"durationSeconds":15}}]},{"row":"music","cards":[{"id":"1cc5b07e-d3ee-42f0-a4a0-b98bf05a23df","kind":"text","text":"The tone shifts as the soundtrack transitions into `dreamy_upbeat`.","time":{"positionSeconds":0,"durationSeconds":30,"endBeatId":"1bf5611f-03ed-4a34-be3d-6d86c8b0514e"}}]},{"row":"text_graphics","cards":[]}]},{"id":"1bf5611f-03ed-4a34-be3d-6d86c8b0514e","name":"Beat 4: Resolution & Making People Smile","targetDurationSeconds":15,"tracks":[{"row":"a_roll","cards":[{"id":"5338b348-4feb-41be-be   <script>
  (() => {
    const root=document.getElementById('pinboard-drawing');
    const screen=root.querySelector('#pb-screen');
    const data=JSON.parse(root.querySelector('#pb-data').textContent);
    const state={page:'comparison',code:'n1',condition:'grid',diff:true,focus:null,zoom:100,inspector:null,search:'',person:'all',filter:'both',linked:true};
    const escape=value=>String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
    const labels={b_roll:'B-Roll',a_roll:'A-Roll',music:'Music',text_graphics:'Text / Graphics'};
    const tracks=Object.keys(labels);
    const projectFor=(code=state.code,condition=state.condition)=>data.projects.find(project=>project.code===code&&project.condition===condition);
    const people=[...new Map(data.projects.map(project=>[project.code,project.participant])).entries()];
    const phaseTitle=phase=>phase==='initial'?'Initial':'Revised';
    const statusLabel=status=>({'supported-visible-content':'Reference supported','partial-reference-support':'Partly checked','reconstructed-partial':'Partial reconstruction','missing-reference':'Reference missing','needs-review':'Needs closer review'}[status]||status);
    const duration=beat=>Number(beat.targetDurationSeconds)||Math.max(1,...beat.tracks.flatMap(track=>track.cards.map(card=>(Number(card.time?.positionSeconds)||0)+(Number(card.time?.durationSeconds)||0))));
    function flatten(plan) {
      const result=new Map();
      for(const beat of plan.beats??[])for(const track of beat.tracks??[]) {
        function add(card,parent=null){result.set(card.id,{...card,beatId:beat.id,beatName:beat.name,track:card.row||track.row,parent});for(const child of card.children??[])add(child,card.id);}
        for(const card of track.cards??[])add(card);
      }
      return result;
    }
    function differences(before,after) {
      const fields=[['text','Text'],['summary','Group description'],['momentId','Source asset'],['sourceStartS','Source start'],['sourceEndS','Source end'],['time','Plan timing'],['track','Track'],['beatId','Beat'],['parent','Group'],['kind','Card type']];
      if(!before)return ['Added card'];if(!after)return ['Removed card'];
      return fields.filter(([key])=>JSON.stringify(before[key]??null)!==JSON.stringify(after[key]??null)).map(([key,label])=>label);
    }
    function textDiff(initial,revised) {
      const before=String(initial).split('\n'),after=String(revised).split('\n');
      const matrix=Array.from({length:before.length+1},()=>new Uint16Array(after.length+1));
      for(let left=before.length-1;left>=0;left--)for(let right=after.length-1;right>=0;right--)matrix[left][right]=before[left]===after[right]?matrix[left+1][right+1]+1:Math.max(matrix[left+1][right],matrix[left][right+1]);
      const leftStatus=before.map(()=>''),rightStatus=after.map(()=>'');let left=0,right=0;
      while(left<before.length||right<after.length){if(left<before.length&&right<after.length&&before[left]===after[right]){left++;right++;}else if(right<after.length&&(left===before.length||matrix[left][right+1]>=matrix[left+1][right])){rightStatus[right++]='added';}else{leftStatus[left++]='removed';}}
      return {before,after,leftStatus,rightStatus};
    }
    function poster(project,phase,open=true) {
      const image=project.phases[phase].poster;
      return `<${open?'button':'div'} ${open?`type="button" data-open="${project.code}:${project.condition}:${phase}"`:''} class="p-poster" aria-label="Open ${escape(project.participant)} ${project.condition} comparison">${image?`<img src="${image}" alt="${escape(project.participant)} ${phase} video still">`:''}<span class="p-poster-label"><span>${phaseTitle(phase)} video</span><span class="p-play" aria-hidden="true">▷</span></span></${open?'button':'div'}>`;
    }
    function renderGallery() {
      const participants=people.filter(([code,name])=>(state.person==='all'||state.person===code)&&name.includes(state.search.toLowerCase()));
      screen.innerHTML=`<h1>Participant gallery</h1><p class="p-muted">Initial ideas, revised plans, and the videos they became.</p><div class="p-toolbar"><label class="p-search">Search participants<input id="pb-search" value="${escape(state.search)}" placeholder="Name or participant code"></label><label>Participant<select id="pb-person"><option value="all">All participants</option>${people.map(([code,name])=>`<option value="${code}" ${state.person===code?'selected':''}>${escape(name)}</option>`).join('')}</select></label><label>Condition<select id="pb-condition"><option value="both">Text + Grid</option><option value="text" ${state.filter==='text'?'selected':''}>Text</option><option value="grid" ${state.filter==='grid'?'selected':''}>Grid</option></select></label></div><div class="p-rows">${participants.map(([code,name])=>`<details class="p-person" open><summary>${escape(name)}</summary><div class="p-pair">${data.projects.filter(project=>project.code===code&&(state.filter==='both'||state.filter===project.condition)).map(project=>`<section class="p-condition"><div class="p-condition-head"><h2>${project.condition==='grid'?'Grid':'Text'}</h2><span class="p-muted p-small">${escape(project.name)}</span></div>${poster(project,'revised')}<div class="p-slots"><button type="button" class="p-button" data-open="${code}:${project.condition}:initial">Initial video + plan</button><button type="button" class="p-button" data-open="${code}:${project.condition}:revised">Revised + diff</button></div></section>`).join('')}</div></details>`).join('')||'<p>No matching participants.</p>'}</div>`;
    }
    function scorePanel(phase,entry) {
      if(!entry)return '<div class="p-score p-muted">Plan-following score not supplied.</div>';
      return `<section class="p-score"><div class="p-small p-muted">RQ2 · ${phaseTitle(phase)} plan following</div><span class="p-score-value">${escape(entry.rating)} <span class="p-small p-muted">${Number.isFinite(entry.percent)?`· ${entry.percent}%`:''}</span></span><details><summary>Requirements · passed / failed / partial</summary><ul class="p-checks">${(entry.checks??[]).map(check=>`<li data-outcome="${check.outcome}"><span class="p-small">${({pass:'✓ Passed',fail:'× Didn’t pass',mixed:'◐ Partial'})[check.outcome]||check.outcome}</span><br>${escape(check.text)}</li>`).join('')}</ul></details></section>`;
    }
    function cardLabel(card,project) { const moment=project.moments[card.momentId];return card.text||card.summary||moment?.title||moment?.videoName||'Unidentified asset'; }
    function gridView(project,phase) {
      const sourcePlan=project.phases[phase].plan;
      const plan={beats:[...sourcePlan.beats]};
      if(phase==='revised'&&state.diff) {
        const ids=new Set(plan.beats.map(beat=>beat.id));
        for(const beat of project.phases.initial.plan.beats)if(!ids.has(beat.id))plan.beats.push({...beat,name:`Removed beat · ${beat.name}`,tracks:[]});
      }
      const before=flatten(project.phases.initial.plan),after=flatten(project.phases.revised.plan);
      const columns=`76px ${plan.beats.map(beat=>`${Math.max(160,duration(beat)*11)*state.zoom/100}px`).join(' ')}`;
      let offset=0;
      let content=`<div class="p-grid-row p-grid-head" style="grid-template-columns:${columns}"><div class="p-track">Time / beat</div>${plan.beats.map(beat=>{const start=offset;offset+=duration(beat);return `<div class="p-beat"><span>${start.toFixed(0)}–${offset.toFixed(0)}s</span><strong>${escape(beat.name)}</strong><span>~${duration(beat).toFixed(0)}s planned</span></div>`;}).join('')}</div>`;
      for(const trackName of tracks) {
        const cells=plan.beats.map(beat=>{
          const cards=[...(beat.tracks.find(track=>track.row===trackName)?.cards??[])];
          if(phase==='revised'&&state.diff){const ids=new Set(after.keys());for(const old of before.values())if(!ids.has(old.id)&&old.beatId===beat.id&&old.track===trackName&&!old.parent)cards.push({...old,_removed:true});}
          const lanes=[];const positioned=cards.map(card=>{const start=Math.max(0,Number(card.time?.positionSeconds)||0);const span=Math.max(1,Number(card.time?.durationSeconds)||3);const viewStart=Math.min(92,100*start/duration(beat));const viewWidth=Math.min(100-viewStart,Math.max(9,100*span/duration(beat)));let lane=lanes.findIndex(end=>end<=viewStart);if(lane<0)lane=lanes.length;lanes[lane]=viewStart+viewWidth;return {card,start,span,lane,viewStart,viewWidth};});
          return `<div class="p-cell" style="height:${Math.max(80,lanes.length*77+8)}px">${positioned.map(({card,start,span,lane,viewStart,viewWidth})=>{const changes=differences(before.get(card.id),after.get(card.id));const change=!state.diff?'':card._removed?'removed':!before.has(card.id)?'added':changes.length?'changed':'';return `<button type="button" class="p-grid-card" data-card="${escape(card.id)}" data-phase="${phase}" data-change="${change}" style="left:${viewStart}%;width:${viewWidth}%;top:${lane*77+5}px" aria-label="Inspect ${escape(cardLabel(card,project))}"><span class="p-card-kind">${card.kind==='group'?`▱ Group · ${card.children?.length??0}`:card.kind==='asset'?'▧ Asset':'▤ Note'} · ${span.toFixed(1)}s${change?' · '+change:''}</span>${escape(cardLabel(card,project))}</button>`;}).join('')}</div>`;
        });
        content+=`<div class="p-grid-row" style="grid-template-columns:${columns}"><div class="p-track">${labels[trackName]}</div>${cells.join('')}</div>`;
      }
      return `<div class="p-timeline-shell" data-scroll-phase="${phase}"><div class="p-timeline">${content}</div></div>`;
    }
    function textView(project,phase) {
      const diff=textDiff(project.phases.initial.plan,project.phases.revised.plan);
      const lines=phase==='initial'?diff.before:diff.after;
      const statuses=phase==='initial'?diff.leftStatus:diff.rightStatus;
      return `<div class="p-text" data-scroll-phase="${phase}">${lines.map((line,index)=>`<div class="p-line" data-change="${state.diff?statuses[index]:''}"><span class="p-line-number">${index+1}</span><span>${escape(line).replace(/\[\[(clip|sound):[^\]]+\]\]/g,reference=>`<button type="button" class="p-clip" data-reference="${reference}" data-phase="${phase}">${reference}</button>`)||' '}</span></div>`).join('')}</div>`;
    }
    function provenance(project,phase) {
      const audit=project.phases[phase].audit;
      return `<details class="p-provenance"><summary>${statusLabel(audit.status)} · plan source</summary><dl><dt>Selected plan</dt><dd>${escape(audit.selectedCandidate)}</dd><dt>Recorded time</dt><dd>${escape(audit.selectedTimestamp||'Not recorded / reconstructed')}</dd><dt>Reference views</dt><dd>${audit.screenshots.length?audit.screenshots.map(escape).join('<br>'):'No screenshot supplied'}</dd></dl>${audit.notes.map(note=>`<p class="p-warning">${escape(note)}</p>`).join('')}</details>`;
    }
    function phaseView(project,phase) {
      const phaseData=project.phases[phase];
      const pairing=phaseData.audit.notes.some(note=>note.includes('AFTER'));
      return `<section class="p-phase ${state.focus?'p-focus-stage':''}" id="pb-phase-${phase}"><div class="p-phase-title"><h2>${phaseTitle(phase)} ${phase==='revised'?'· changes highlighted':''}</h2><span class="p-pill">${statusLabel(phaseData.audit.status)}</span></div>${pairing?'<p class="p-warning" style="margin-bottom:12px">Video pairing needs review: this reference plan postdates the earliest archived video.</p>':''}<div class="p-stage"><div class="p-video-column"><div class="p-video-still">${phaseData.poster?`<img src="${phaseData.poster}" alt="${phaseTitle(phase)} video still">`:''}</div><div class="p-video-controls"><span aria-label="Paused">▷</span><span class="p-small" data-time="${phase}">0:00</span><input type="range" min="0" max="60" value="0" data-scrub="${phase}" aria-label="Illustrate ${phase} video position"><span class="p-small">Paused</span></div><p class="p-video-caption">${phaseTitle(phase)} video · paused on open<br>Storyboard still; playback belongs to the finished app.</p>${scorePanel(phase,phaseData.score)}</div><div class="p-plan"><div class="p-plan-toolbar"><strong>${phaseTitle(phase)} ${project.condition==='grid'?'Grid':'Text plan'}</strong><div class="p-actions">${project.condition==='grid'?`<button type="button" class="p-button" data-zoom="-20" aria-label="Zoom out">−</button><span class="p-small">${state.zoom}%</span><button type="button" class="p-button" data-zoom="20" aria-label="Zoom in">+</button><button type="button" class="p-button" data-fit="true">Fit</button>`:''}<button type="button" class="p-button" data-expand="${phase}">${state.focus?'Return to comparison':'Expand plan'}</button></div></div>${project.condition==='grid'?gridView(project,phase):textView(project,phase)}<div class="p-legend">${state.diff?'＋ Added · − Removed · Orange: edited / moved / retimed':'Original plan appearance · highlights hidden'}</div>${provenance(project,phase)}</div></div></section>`;
    }
    function inspector(project) {
      if(!state.inspector)return '';
      if(state.inspector.reference)return `<aside class="p-inspector" aria-label="Clip reference"><div class="p-inspector-head"><h3>Clip reference · ${phaseTitle(state.inspector.phase)}</h3><button type="button" class="p-button" data-dismiss="true">Close details</button></div><p>${escape(state.inspector.reference)}</p><p class="p-muted p-small">Source name and time range are preserved. Source footage is not included in this archive.</p></aside>`;
      const before=flatten(project.phases.initial.plan).get(state.inspector.id),after=flatten(project.phases.revised.plan).get(state.inspector.id);
      const changes=differences(before,after);
      return `<aside class="p-inspector" aria-label="Card details"><div class="p-inspector-head"><h3>Card inspector · ${changes.length?changes.join(', '):'Unchanged'}</h3><button type="button" class="p-button" data-dismiss="true">Close details</button></div><div class="p-inspector-body">${[['initial',before],['revised',after]].map(([phase,card])=>`<section><h3>${phaseTitle(phase)}</h3>${card?`<p>${escape(cardLabel(card,project))}</p><p class="p-muted p-small" style="margin-top:8px">${escape(card.beatName)} · ${labels[card.track]}<br>Position ${Number(card.time?.positionSeconds||0).toFixed(1)}s · duration ${Number(card.time?.durationSeconds||0).toFixed(1)}s</p>${card.momentId?`<p class="p-small">Source: ${escape(project.moments[card.momentId]?.videoName||'Not recovered')}<br>Range: ${escape(card.sourceStartS??project.moments[card.momentId]?.startS??'?')}–${escape(card.sourceEndS??project.moments[card.momentId]?.endS??'?')}s</p>`:''}${card.notes?`<details><summary>Source notes</summary><p>${escape(card.notes)}</p></details>`:''}${card.children?.length?`<details open><summary>${card.children.length} group members</summary>${card.children.map(child=>`<button type="button" class="p-button" style="display:block;margin-top:6px;max-width:100%;text-align:left" data-card="${escape(child.id)}" data-phase="${phase}">${escape(cardLabel(child,project))}</button>`).join('')}</details>`:''}`:'<p class="p-muted">Card does not exist in this version.</p>'}</section>`).join('')}</div></aside>`;
    }
    function comparisonSummary(project) {
      let initial,revised,added,removed,changed,unchanged;
      if(project.condition==='text') {
        const diff=textDiff(project.phases.initial.plan,project.phases.revised.plan);
        initial=diff.before.filter(line=>line.trim()).length;revised=diff.after.filter(line=>line.trim()).length;
        added=diff.after.filter((line,index)=>line.trim()&&diff.rightStatus[index]==='added').length;
        removed=diff.before.filter((line,index)=>line.trim()&&diff.leftStatus[index]==='removed').length;
        unchanged=initial-removed;changed=null;
      } else {
        const before=flatten(project.phases.initial.plan),after=flatten(project.phases.revised.plan);
        initial=before.size;revised=after.size;
        added=[...after.keys()].filter(id=>!before.has(id)).length;
        removed=[...before.keys()].filter(id=>!after.has(id)).length;
        changed=[...before.keys()].filter(id=>after.has(id)&&differences(before.get(id),after.get(id)).length).length;
        unchanged=initial-removed-changed;
      }
      const initialScore=project.phases.initial.score?.percent,revisedScore=project.phases.revised.score?.percent;
      return `<p class="p-small p-muted" style="margin-bottom:14px">${initial} initial → ${revised} revised ${project.condition==='grid'?'cards':'nonblank lines'} · +${added} added · −${removed} removed${changed===null?'':` · ${changed} changed`} · ${unchanged} unchanged${Number.isFinite(initialScore)&&Number.isFinite(revisedScore)?` · RQ2 change: ${revisedScore-initialScore>=0?'+':''}${(revisedScore-initialScore).toFixed(1)} pp`:''}</p>`;
    }
    function renderComparison() {
      const project=projectFor();
      screen.innerHTML=`<div class="p-modal-head"><div><div class="p-small p-muted">Participant comparison</div><h1>${escape(project.participant)}</h1><div class="p-modal-meta"><span>${escape(project.name)}</span><span class="p-small p-muted">${escape(project.id)}</span></div></div><div class="p-actions"><button type="button" class="p-button" data-switch="text" aria-pressed="${state.condition==='text'}">Text</button><button type="button" class="p-button" data-switch="grid" aria-pressed="${state.condition==='grid'}">Grid</button><button type="button" class="p-button" data-page="gallery">Close comparison ×</button></div></div><div class="p-actions" style="margin-bottom:16px"><label><input type="checkbox" id="pb-diff" ${state.diff?'checked':''}> Show revision highlights</label><label><input type="checkbox" id="pb-linked" ${state.linked?'checked':''}> Link plan scrolling</label><span class="p-small p-muted">Read-only study plans</span></div>${inspector(project)}${(state.focus?[state.focus]:['initial','revised']).map(phase=>phaseView(project,phase)).join('')}<div class="p-actions" style="margin-top:16px"><button type="button" class="p-button" data-neighbor="-1">← Previous participant</button><button type="button" class="p-button" data-neighbor="1">Next participant →</button><button type="button" class="p-button" data-page="audit">Review plan evidence</button></div>`;
      screen.insertAdjacentHTML('afterbegin',comparisonSummary(project));
      const scrollers=[...screen.querySelectorAll('[data-scroll-phase]')];let syncing=false;
      for(const scroller of scrollers)scroller.addEventListener('scroll',()=>{if(!state.linked||syncing)return;syncing=true;for(const other of scrollers)if(other!==scroller){other.scrollLeft=scroller.scrollLeft;other.scrollTop=scroller.scrollTop;}requestAnimationFrame(()=>{syncing=false;});});
    }
    function renderAudit() {
      screen.innerHTML=`<h1>Plan evidence</h1><p class="p-muted">52 plan states · 79 reference screenshots · provisional selections</p><p class="p-warning" style="margin-top:14px">Reference matching and video matching are separate checks. Brian Text, Brian Grid, and Jonah Grid need a video-pairing decision.</p><div class="p-table-shell"><table><thead><tr><th>Participant / condition</th><th>Initial plan</th><th>Revised plan</th><th>Inspect</th></tr></thead><tbody>${data.projects.map(project=>`<tr><td>${escape(project.participant)}<br>${project.condition==='grid'?'Grid':'Text'}</td>${['initial','revised'].map(phase=>`<td>${statusLabel(project.phases[phase].audit.status)}<br><span class="p-muted">${project.phases[phase].audit.notes.some(note=>note.includes('later generation'))?'Later generation selected':project.phases[phase].audit.screenshots.length+' reference views'}</span>${project.phases[phase].audit.notes.some(note=>note.includes('AFTER'))?'<br><strong>Video pairing unresolved</strong>':''}</td>`).join('')}<td><button type="button" class="p-button" data-open="${project.code}:${project.condition}:initial">Open</button></td></tr>`).join('')}</tbody></table></div>`;
    }
    function renderInteractions() {
      const groups=[['Gallery',['Rows start open; the participant heading collapses or expands a row.','Search, participant, and condition filters update the gallery.','Final video still opens that condition’s comparison.','Initial / Revised buttons open the comparison at the selected phase.','Order stays N1–N7, E1, E2, E3, E5, E4, E6.']],['Comparison',['Text / Grid switches condition for the same participant.','Initial row: video on the left, Initial plan immediately on the right.','Revised row: video on the left, Revised plan and diff on the right.','Both videos open paused; native play, seek, volume, and fullscreen in the finished app.','Close or Escape returns to the gallery; Previous / Next follows participant order.']],['Grid and card inspection',['Beats run horizontally; B-Roll, A-Roll, Music, and Text/Graphics run vertically.','Scroll to pan; + / − zooms; Fit resets the drawing scale.','Click any note, asset, or group to compare its full Initial / Revised details.','Expand a group in the inspector; click a member to inspect it.','Changed timing, source, group, text, and placement are labelled; removed cards remain inspectable.']],['Text and revision highlights',['Read full text with line numbers and scroll within the plan.','Click a clip or sound reference to inspect its recorded source range.','Revision highlights switch on or off for both versions.','Ordered line comparison preserves repeated lines.','Link scrolling moves both plans together; unlink for independent reading.']],['Scores and evidence',['Each video keeps its phase’s plan-following fraction and percentage.','Requirements expand to show every passed, failed, and partial item verbatim.','Plan source expands to show reference files, recorded time, and verification limits.','Plan audit opens the evidence overview for all 26 projects.','No source-clip playback is promised where footage is absent.']],['Expanded view and missing data',['Expand plan gives the selected plan the full comparison width; Return restores both rows.','On narrow screens, the video stacks above its own plan.','Missing media keeps the plan and score accessible; the finished app shows an unavailable state.','Reference-missing and reconstructed states retain visible labels.','Plans are inspection-only; clicking never edits the study record.']]];
      screen.innerHTML=`<h1>Interaction map</h1><p class="p-muted">The proposed behavior of every main screen and control.</p><div class="p-interactions">${groups.map(([title,items])=>`<section class="p-interaction"><h3>${title}</h3><ul>${items.map(item=>`<li>${item}</li>`).join('')}</ul></section>`).join('')}</div>`;
    }
    function render() {
      for(const button of root.querySelectorAll('[data-page]')){if(button.closest('.p-top'))button.setAttribute('aria-current',button.dataset.page===state.page?'page':'false');}
      if(state.page==='gallery')renderGallery();else if(state.page==='comparison')renderComparison();else if(state.page==='audit')renderAudit();else renderInteractions();
    }
    root.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button)return;
      if(button.dataset.page){state.page=button.dataset.page;state.focus=null;state.inspector=null;render();return;}
      if(button.dataset.open){const [code,condition,phase]=button.dataset.open.split(':');Object.assign(state,{page:'comparison',code,condition,focus:null,inspector:null});render();screen.querySelector(`#pb-phase-${phase}`)?.scrollIntoView({block:'nearest',behavior:'smooth'});return;}
      if(button.dataset.switch){state.condition=button.dataset.switch;state.focus=null;state.inspector=null;render();return;}
      if(button.dataset.card){state.inspector={id:button.dataset.card,phase:button.dataset.phase};renderComparison();screen.querySelector('.p-inspector').scrollIntoView({block:'nearest',behavior:'smooth'});return;}
      if(button.dataset.reference){state.inspector={reference:button.dataset.reference,phase:button.dataset.phase};renderComparison();screen.querySelector('.p-inspector').scrollIntoView({block:'nearest',behavior:'smooth'});return;}
      if(button.dataset.dismiss){state.inspector=null;renderComparison();return;}
      if(button.dataset.zoom){state.zoom=Math.max(60,Math.min(200,state.zoom+Number(button.dataset.zoom)));renderComparison();return;}
      if(button.dataset.fit){state.zoom=100;renderComparison();return;}
      if(button.dataset.expand){state.focus=state.focus?null:button.dataset.expand;renderComparison();return;}
      if(button.dataset.neighbor){const index=people.findIndex(([code])=>code===state.code);state.code=people[(index+Number(button.dataset.neighbor)+people.length)%people.length][0];state.inspector=null;state.focus=null;render();}
    });
    root.addEventListener('change',event=>{
      if(event.target.id==='pb-diff'){state.diff=event.target.checked;renderComparison();}
      if(event.target.id==='pb-linked')state.linked=event.target.checked;
      if(event.target.id==='pb-person'){state.person=event.target.value;renderGallery();}
      if(event.target.id==='pb-condition'){state.filter=event.target.value;renderGallery();}
    });
    root.addEventListener('input',event=>{
      if(event.target.id==='pb-search'){const position=event.target.selectionStart;state.search=event.target.value;renderGallery();const input=screen.querySelector('#pb-search');input.focus();input.setSelectionRange(position,position);}
      if(event.target.dataset.scrub){const seconds=Number(event.target.value);screen.querySelector(`[data-time="${event.target.dataset.scrub}"]`).textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;}
    });
    root.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.page==='comparison'){if(state.inspector)state.inspector=null;else if(state.focus)state.focus=null;else state.page='gallery';render();}});
    render();
    if(globalThis.Tweak) {
      const layout={planWidth:70};
      const controls=new Tweak({container:root,onChange:()=>{root.style.setProperty('--pb-plan-share',`${layout.planWidth}fr`);root.style.setProperty('--pb-video-share',`${100-layout.planWidth}fr`);}});
      controls.addSlider(layout,'planWidth',{label:'Plan width',min:55,max:80,step:5,unit:'%'});
    }
  })();
  </script>
</div>
